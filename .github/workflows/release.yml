name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      suffix:
        description: "版本后缀（如 v1.0.0），留空则不带后缀"
        required: false
        default: ""

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-name: sct-linux
          - os: windows-latest
            artifact-name: sct-windows
          - os: macos-latest
            artifact-name: sct-macos

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Determine version suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "suffix=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SUFFIX="${{ inputs.suffix }}"
            if [ -z "$SUFFIX" ]; then
              echo "suffix=" >> "$GITHUB_OUTPUT"
            else
              echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build binaries
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ steps.version.outputs.suffix }}" ]; then
            uv run python build_installer.py --all --suffix "${{ steps.version.outputs.suffix }}"
          else
            uv run python build_installer.py --all
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
